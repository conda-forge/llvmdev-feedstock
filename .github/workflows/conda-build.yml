# This file was generated automatically from conda-smithy. To update this configuration,
# update the conda-forge.yml and/or the recipe/meta.yaml.
# -*- mode: yaml -*-

name: Build conda package
on:
  push:

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.CONFIG }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        include:
          - CONFIG: linux_64_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_workspace_dir: build_artifacts
            docker_run_args: 
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-latest']
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_aarch64_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-aarch64:alma10
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_workspace_dir: build_artifacts
            docker_run_args: 
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-24.04-arm']
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_ppc64le_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_workspace_dir: build_artifacts
            docker_run_args: 
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-latest']
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_riscv64_
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-riscv64:rocky10
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_workspace_dir: build_artifacts
            docker_run_args: 
            free_disk_space: skip
            os: ubuntu
            pagefile_size: 0
            resize_partitions: False
            runs_on: ['ubuntu-24.04-riscv']
            tools_install_dir: ~/miniforge3
          - CONFIG: win_64_
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_platform: win-64
            build_workspace_dir: C:\bld
            docker_run_args: 
            free_disk_space: skip
            os: windows
            pagefile_size: 16
            resize_partitions: False
            runs_on: ['namespace-profile-8cpu-on-win-64']
            tools_install_dir: C:\Miniforge
          - CONFIG: win_arm64_
            STORE_BUILD_ARTIFACTS: False
            UPLOAD_PACKAGES: True
            build_platform: win-64
            build_workspace_dir: C:\bld
            docker_run_args: 
            free_disk_space: skip
            os: windows
            pagefile_size: 16
            resize_partitions: False
            runs_on: ['namespace-profile-8cpu-on-win-64']
            tools_install_dir: C:\Miniforge
    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Configure page file on Windows
      if: matrix.os == 'windows' && matrix.pagefile_size > 0
      shell: cmd
      env:
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        PAGEFILE_SIZE: ${{ matrix.pagefile_size }}
      run: |
        call ".scripts\create_pagefile.bat" %PAGEFILE_SIZE%
    - name: Configure binfmt_misc
      if: matrix.os == 'ubuntu'
      shell: bash
      run: |
        if [[ "$(uname -m)" == "x86_64" ]]; then
          docker run --rm --privileged multiarch/qemu-user-static:register --reset --credential yes
        fi

    # TEST ONLY, not part of the rendered workflow: measure what a native
    # riscv64 build actually needs, to size node swap (riseproject-dev/riscv-runner#114).
    - name: Start resource sampler
      if: matrix.os == 'ubuntu'
      shell: bash
      run: |
        cat > /tmp/sampler.sh <<'EOS'
        #!/bin/bash
        anon_peak=0; cur_peak=0; swap_peak=0
        while [ -r /sys/fs/cgroup/memory.stat ]; do
          anon=$(awk '/^anon /{print $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo 0)
          cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo 0)
          swap=$(cat /sys/fs/cgroup/memory.swap.current 2>/dev/null || echo 0)
          [ "${anon:-0}" -gt "$anon_peak" ] && anon_peak=$anon
          [ "${cur:-0}" -gt "$cur_peak" ] && cur_peak=$cur
          [ "${swap:-0}" -gt "$swap_peak" ] && swap_peak=$swap
          printf '%s %s %s\n' "$anon_peak" "$cur_peak" "$swap_peak" > /tmp/mem-peaks
          sleep 10
        done
        EOS
        chmod +x /tmp/sampler.sh
        nohup setsid /tmp/sampler.sh >/dev/null 2>&1 &
        echo "machine: $(uname -m), $(nproc) cores, $(free -g | awk '/^Mem:/{print $2}') GiB RAM"
        echo "node swap: $(swapon --show --noheadings || echo none)"
        echo "cgroup memory.swap.max: $(cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || echo n/a)"
        echo "disk free before build: $(df -h / | awk 'NR==2{print $4}')"

    - name: Build on Linux
      id: build-linux
      if: matrix.os == 'ubuntu'
      env:
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONDA_FORGE_DOCKER_RUN_ARGS: ${{ matrix.docker_run_args }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        RATTLER_BUILD_COLOR: always
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
        FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}
      shell: bash
      run: |
        export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="${GITHUB_REF_NAME}"
        export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        ./.scripts/run_docker_build.sh


    - name: Report resource usage
      if: always() && matrix.os == 'ubuntu'
      shell: bash
      run: |
        gib() { awk -v b="${1:-0}" 'BEGIN { printf "%.2f", b / 1073741824 }'; }
        read -r anon cur swap < /tmp/mem-peaks 2>/dev/null || { echo "no samples collected"; exit 0; }
        {
          echo "### ${{ matrix.CONFIG }} on $(uname -m)"
          echo ""
          echo "| metric | value |"
          echo "|---|---|"
          echo "| peak anonymous memory | $(gib "$anon") GiB |"
          echo "| peak memory.current (incl. page cache) | $(gib "$cur") GiB |"
          echo "| peak swap used | $(gib "$swap") GiB |"
          echo "| cgroup memory.swap.max | $(cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || echo n/a) |"
          echo "| node swap | $(swapon --show=NAME,SIZE --noheadings | tr '\n' ' ' || echo none) |"
          echo "| cores / RAM | $(nproc) / $(free -g | awk '/^Mem:/{print $2}') GiB |"
          echo "| disk free after build | $(df -h / | awk 'NR==2{print $4}') |"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Build on macOS
      id: build-macos
      if: matrix.os == 'macos'
      env:
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        RATTLER_BUILD_COLOR: always
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
        FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}
      shell: bash
      run: |
        export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="${GITHUB_REF_NAME}"
        export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        ./.scripts/run_osx_build.sh

    - name: Build on windows
      id: build-windows
      if: matrix.os == 'windows'
      shell: cmd
      run: |
        set "flow_run_id=github_%GITHUB_RUN_ID%"
        set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
        set "sha=%GITHUB_SHA%"
        call ".scripts\run_win_build.bat"
      env:
        BUILD_PLATFORM: ${{ matrix.build_platform }}
        CI: github_actions
        CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
        CONFIG: ${{ matrix.CONFIG }}
        MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
        PYTHONUNBUFFERED: 1
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        RATTLER_BUILD_COLOR: always
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
        FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}